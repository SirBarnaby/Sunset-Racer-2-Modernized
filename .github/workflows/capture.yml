name: Capture footage
on:
  push:
    branches: [staging]
    paths: ['.github/capture/**', '.github/workflows/capture.yml']
jobs:
  capture:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Screen size
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion
          Get-Command ffmpeg -ErrorAction SilentlyContinue
      - name: Get the game
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/SirBarnaby/Sunset-Racer-2-Modernized/releases/download/v1.0/Sunset-Racer-2-Windows.zip -OutFile game.zip
          Expand-Archive game.zip -DestinationPath C:\sr2
          if (Test-Path .github\capture\prepare.ps1) { & .github\capture\prepare.ps1 -Game 'C:\sr2\Sunset Racer 2' }
      - name: Play and capture
        shell: pwsh
        run: .github\capture\run.ps1 -Game 'C:\sr2\Sunset Racer 2' -Out C:\cap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          path: |
            C:\cap
            C:\sr2\Sunset Racer 2\*.log
            C:\sr2\Sunset Racer 2\*.ini
